name: nn_conversas
description: "NN Conversas — as Conversas do NN Conecta no computador (Windows, macOS e Linux)."
publish_to: 'none'
# ⚠️ `version` e `AppConfig.versao` andam JUNTOS: é a versão que o servidor compara
# para decidir se há atualização.
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.2.2
  window_manager: ^0.4.3
  tray_manager: ^0.2.4
  flutter_local_notifications: ^19.4.2
  flutter_secure_storage: 9.2.4
  file_picker: ^8.1.6
  path_provider: ^2.1.5
  path: ^1.9.0
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.2
  intl: ^0.20.1
  audioplayers: 6.7.1
  web_socket_channel: ^3.0.1
  flutter_widget_from_html_core: 0.17.4
  desktop_drop: 0.8.4
  pasteboard: ^0.5.0
  crypto: ^3.0.3
  win32_registry: ^1.1.5
  ffi: ^2.1.3
  qr_flutter: ^4.1.0
  screen_retriever: ^0.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/bandeja/
    - assets/som/
