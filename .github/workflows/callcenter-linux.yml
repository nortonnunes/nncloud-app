# Gera o Conecta Callcenter para Linux (.deb) numa máquina Ubuntu do GitHub.
# Dispara com a tag de versão (abaixo). O .deb sai em "Artifacts".
# ⚠️ ubuntu-22.04 e não "latest": o binário depende da glibc de onde foi compilado.
name: Callcenter — Instalador Linux

on:
  # Tag de versão (git push origin callcenter-v1.2.3) gera o instalador sozinho, com a API padrão.
  # ⚠️ Prefixo "callcenter-": este código vive no repositório do NN Cloud (branch callcenter),
  # e as tags são do repositório inteiro — "v1.2.3" colidiria com as do NN Cloud.
  push:
    tags: ['callcenter-v*']
  workflow_dispatch:
    inputs:
      api:
        description: 'Endereço da API do NN Conecta (https)'
        required: false
        default: ''

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Bibliotecas de compilação
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libsecret-1-dev libjsoncpp-dev libayatana-appindicator3-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev dpkg-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable

      - name: Dependências e testes
        run: |
          flutter pub get
          flutter test test/formato_test.dart

      - name: Gerar o pacote
        env:
          CALLAPP_API: ${{ inputs.api }}
        run: bash scripts/empacotar-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Conecta-Callcenter-Linux
          path: build/instaladores/*.deb
          if-no-files-found: error
